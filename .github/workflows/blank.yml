name: Android Build

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Install Dependencies
      run: npm install || true

    - name: Force Create Android & Setup Assets
      run: |
        mkdir -p dist
        # جمع الملفات السطحية
        cp -R *.tsx dist/ || true
        cp -R *.ts dist/ || true
        cp -R *.js dist/ || true
        cp -R *.json dist/ || true
        
        if [ ! -f dist/index.html ]; then
          echo '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>وَصْلُ</title></head><body><div id="root"></div></body></html>' > dist/index.html
        fi

        # إزالة أي مجلد أندرويد قديم تالف وإعادة إنشائه بنجاح لضمان وجود gradlew
        rm -rf android
        npx cap add android
        npx cap update android

        # نسخ الملفات إلى أصول أندرويد
        mkdir -p android/app/src/main/assets/public
        cp -rf dist/* android/app/src/main/assets/public/ || true

    - name: Build Debug APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
