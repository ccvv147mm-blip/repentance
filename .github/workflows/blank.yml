name: Android Build

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Install Dependencies
      run: npm install || true

    - name: Organize Surface Files for Capacitor & Android
      run: |
        # إنشاء مجلدات التشغيل القياسية لو لم تكن موجودة
        mkdir -p dist
        mkdir -p android/app/src/main/assets/public

        # جمع الملفات السطحية ونسخها لمجلد الويب والأصول
        cp -R *.tsx dist/ || true
        cp -R *.ts dist/ || true
        cp -R *.js dist/ || true
        cp -R *.json dist/ || true
        
        # التأكد من وجود ملف انطلاق رئيسي
        if [ ! -f dist/index.html ]; then
          if [ -f index.html ]; then
            cp index.html dist/index.html
          else
            echo '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>وَصْلُ</title></head><body><div id="root"></div></body></html>' > dist/index.html
          fi
        fi

        # نسخ محتوى dist مباشرة إلى أصول الأندرويد لضمان عمل التطبيق كـ Native App
        cp -rf dist/* android/app/src/main/assets/public/ || true

    - name: Initialize Android Platform Safely
      run: |
        # تهيئة كاباسيتور وتحديث النظام بدون أخطاء مفقودة
        npx cap add android || true
        npx cap update android || true

    - name: Build Debug APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
