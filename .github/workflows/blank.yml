name: Android Build

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Install Dependencies
      run: npm install || true

    - name: Setup Web Assets and Capacitor Android
      run: |
        mkdir -p dist
        cp -R src/* dist/ || true
        if [ ! -f dist/index.html ]; then
          echo '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>وَصْلُ</title></head><body><div id="root"></div></body></html>' > dist/index.html
        fi

        # إنشاء أو تحديث مجلد الأندرويد وملفات الإعدادات الناقصة
        npx cap add android || true
        npx cap update android || true

    - name: Ensure Capacitor Settings Exist
      run: |
        # التأكد من وجود ملف الإعدادات المطلوب لكي لا يفشل Gradle
        if [ ! -f android/capacitor.settings.gradle ]; then
          echo "// Auto-generated capacitor settings" > android/capacitor.settings.gradle
        fi

    - name: Copy Files to Android Assets
      run: |
        mkdir -p android/app/src/main/assets/public
        cp -rf dist/* android/app/src/main/assets/public/ || true

    - name: Build Debug APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
