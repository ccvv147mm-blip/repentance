name: Android Build

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Install Dependencies
      run: npm install || true

    - name: Setup Web Assets from Root Files
      run: |
        mkdir -p dist
        # نسخ ملفات الويب والواجهة إلى مجلد dist ليعتمد عليها كاباسيتور
        cp -R *.tsx dist/ || true
        cp -R src/* dist/ || true
        if [ ! -f dist/index.html ]; then
          echo '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>وَصْلُ</title></head><body><div id="root"></div></body></html>' > dist/index.html
        fi

    - name: Init Capacitor & Add Android
      run: |
        npx cap add android || true
        npx cap sync android || true

    - name: Copy Files to Android Assets
      run: |
        mkdir -p android/app/src/main/assets/public
        cp -rf dist/* android/app/src/main/assets/public/ || true

    - name: Build Debug APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
