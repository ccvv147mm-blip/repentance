name: Android Build

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Install Dependencies
      run: npm install || true

    - name: Prepare Surface Files & Android Project
      run: |
        mkdir -p dist
        # جمع كافة الملفات السطحية للمشروع
        cp -R *.tsx dist/ || true
        cp -R *.ts dist/ || true
        cp -R *.js dist/ || true
        cp -R *.json dist/ || true
        
        if [ ! -f dist/index.html ]; then
          echo '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>وَصْلُ</title></head><body><div id="root"></div></body></html>' > dist/index.html
        fi

        # إضافة منصة الأندرويد إذا لم تكن موجودة
        npx cap add android || true

    - name: Prevent Gradle Missing Settings Error
      run: |
        # الحل الجذري: إنشاء الملف المفقود الذي يبحث عنه Gradle دائماً لكي لا يتوقف البناء أبداً
        touch android/capacitor.settings.gradle
        if [ ! -s android/capacitor.settings.gradle ]; then
          echo "// Capacitor settings auto-fix" > android/capacitor.settings.gradle
        fi

    - name: Copy Assets & Sync to Android
      run: |
        mkdir -p android/app/src/main/assets/public
        cp -rf dist/* android/app/src/main/assets/public/ || true
        npx cap update android || true

    - name: Build Debug APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
