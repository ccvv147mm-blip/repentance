name: Android Build

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Install Dependencies
      run: npm install

    - name: Prepare Web Assets Directory
      run: |
        mkdir -p dist
        # نسخ الملفات الأساسية لداخل مجلد dist ليجدها كاباسيتور فوراً
        cp -R src/* dist/ || true
        touch dist/index.html

    - name: Add Android Platform and Sync
      run: |
        npx cap add android || true
        npx cap sync android

    - name: Copy Assets to Android Project
      run: |
        mkdir -p android/app/src/main/assets/public
        cp -rf dist/* android/app/src/main/assets/public/ || true

    - name: Build Debug APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
